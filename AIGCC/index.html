<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c7db7" />
  <title>一座岛的100天 · 100 Days of Biodiversity</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky-glow glow-one"></div>
  <div class="sky-glow glow-two"></div>
  <main id="app">
    <section id="start-screen" class="start-screen screen">
      <div class="start-copy">
        <p class="eyebrow">100 DAYS OF BIODIVERSITY</p>
        <h1>一座岛的<br><em>100天</em></h1>
        <p class="tagline">让生命重新回到这座岛。</p>
        <p class="start-intro">每天做一个温柔但重要的决定，让植物、昆虫、动物与栖息地重新连结。</p>
        <div class="start-actions">
          <button class="button primary large" data-action="start">开始恢复生态 <span>→</span></button>
          <button class="button ghost" data-action="open-codex">生态图鉴</button>
          <button class="text-button" data-action="open-guide">游戏说明</button>
        </div>
      </div>
      <div class="cover-art" aria-label="一座正在复苏的卡通岛屿">
        <div class="cover-sun"></div><div class="cover-cloud cloud-a"></div><div class="cover-cloud cloud-b"></div>
        <div class="cover-sea"></div><div class="cover-island"></div>
        <span class="cover-tree tree-one">🌳</span><span class="cover-tree tree-two">🌲</span>
        <span class="cover-flower">🌼</span><span class="cover-bee">🐝</span><span class="cover-bird">🐦</span>
        <span class="cover-wave wave-a">⌇</span><span class="cover-wave wave-b">⌇</span>
        <p class="cover-caption">从一株野花开始</p>
      </div>
    </section>

    <section id="game-screen" class="game-screen screen hidden" aria-live="polite">
      <header class="game-header">
        <button class="brand" data-action="show-guide" title="查看游戏说明"><span>◒</span> 一座岛的100天</button>
        <div class="day-meter">
          <span id="day-label">第 1 / 100 天</span>
          <div class="progress-track"><i id="day-progress"></i></div>
        </div>
        <div class="header-tools">
          <button class="round-button" data-action="open-codex" title="生态图鉴" aria-label="生态图鉴">▤</button>
          <button class="round-button" data-action="open-network" title="生态网络" aria-label="生态网络">⌘</button>
          <button class="round-button subtle" data-action="restart" title="重新开始" aria-label="重新开始">↻</button>
        </div>
      </header>

      <section class="metric-strip" aria-label="核心生态指标">
        <article class="metric-card biodiversity"><span class="metric-icon">✦</span><div><small>生物多样性</small><strong id="metric-biodiversity">9</strong></div></article>
        <article class="metric-card stability"><span class="metric-icon">◌</span><div><small>生态稳定性</small><strong id="metric-stability">28</strong></div></article>
        <article class="metric-card habitat"><span class="metric-icon">⌂</span><div><small>栖息地完整度</small><strong id="metric-habitat">16</strong></div></article>
        <article class="metric-card chain"><span class="metric-icon">↝</span><div><small>食物链</small><strong id="metric-food-chain">3</strong></div></article>
      </section>

      <section class="island-layout">
        <div class="island-panel">
          <div class="island-toolbar"><span id="stage-label" class="stage-pill">恢复初期</span><span id="scene-caption">荒岛正在等待第一株新芽。</span></div>
          <div id="island-world" class="island-world" role="img" aria-label="岛屿生态景观"></div>
          <div id="island-legend" class="island-legend"></div>
        </div>
        <aside class="ecosystem-sidebar">
          <section class="sidebar-card habitat-card">
            <div class="card-heading"><div><p class="kicker">生态体征</p><h2>栖息地状态</h2></div><span>实时</span></div>
            <div id="habitat-bars" class="habitat-bars"></div>
          </section>
          <section id="strategy-card" class="sidebar-card strategy-card"></section>
          <section id="insight-card" class="sidebar-card insight-card"></section>
          <section class="sidebar-card mini-guide">
            <span class="mini-guide-icon">✣</span><p>均衡比堆高单一物种更重要。点击 <b>生态网络</b> 随时查看关系。</p>
          </section>
        </aside>
      </section>

      <section class="actions-section">
        <div class="action-heading"><div><p class="kicker">今天能做什么？</p><h2>选择一项生态行动</h2></div><p id="choice-hint">每个选择都会留下长期的生态回响。</p></div>
        <div id="action-cards" class="action-cards"></div>
      </section>
    </section>

    <section id="results-screen" class="results-screen screen hidden"></section>
  </main>
  <div id="modal-root" class="modal-root" aria-live="assertive"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/data.js" defer></script>
  <script src="js/ecosystem.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
